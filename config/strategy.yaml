# =====================================================================
# quant-starter — the only parameter file
# 唯一参数文件。学生的每一步调整都从这里开始：改一个值 → 重跑 → 看数字怎么动。
# Every value carries "why this number" and "what changes if you move it".
# 每个值都写清"为什么是这个数"和"改了会怎样"。
# =====================================================================

data:
  prices: data/sample/prices.csv
  fundamentals: data/sample/fundamentals.csv
  universe: data/sample/universe.csv
  benchmark: SPY
  # The sample stores the fiscal period END, not the announcement date. 45 days is
  # the SEC 10-Q upper bound, so a report becomes usable at the earliest 45 days
  # after period end. Set to 0 only if your source gives the real release date.
  # 样本给的是"财季期末日"，不是公告日。45 天是 SEC 10-Q 的上限：
  # 期末后 45 天内公告才可能被看到 → 最早 45 天后才允许使用。
  # 若你的数据源给的是真实公告日，改成 0。
  disclosure_lag_days: 45

backtest:
  # 2013 is data warm-up (12-1 momentum needs 273 trading days).
  # 2013 年是 data warm-up（12-1 动量需要 273 个交易日）。
  start: "2014-04-01"
  end: "2026-09-30"
  # quarterly | semiannual  (L1 experiment: what happens with semiannual?)
  # quarterly | semiannual（L1 实验：换成半年会怎样）
  rebalance: quarterly
  # decide at the rebalance close, fill at the NEXT close. Try 0 to see the price
  # of the "same-close" assumption.
  # 决策日收盘 → 下一交易日收盘成交。改成 0 试试这个假设值多少。
  execution_lag_days: 1

strategy:
  # 12 of 45 names; a $50k account puts ~$4,000 in each.
  # 45 只样本里选 12 只；$50k 账户每只约 $4,000。
  top_n: 12
  factors:
    fcf_yield: 0.500          # free cash flow yield 自由现金流收益率
    quality: 0.375            # ROE + gross margin − leverage (cross-sectional z) ROE+毛利率−杠杆
    momentum: 0.125           # 12-1 momentum 12-1 动量
  momentum_lookback: 252      # trading days 交易日
  momentum_skip: 21           # skip the last month (reversal effect) 跳过最近一个月（反转效应）

portfolio:
  max_weight: 0.12            # single-name cap 12% 单票上限 12%
  # Sector cap 35%. With 12 names, two in one sector is ~16.7% and never binds;
  # the cap guards against "one sector takes the whole top 12".
  # 行业上限 35%（12 只 × 2 只同行业 ≈ 16.7%，不会触发；
  # 这个上限防的是"某行业突然全进前 12"）。
  max_sector: 0.35
  min_cash: 0.02              # cash floor 最低现金 2%
  sell_rank_buffer: 2.0       # sell only after falling out of Top 24 (buffer band) 排名跌出 Top 24 才卖（缓冲带）
  # Skip trades smaller than 1% of NAV: stops equal-weight rebalancing from paying
  # for drift noise. L1 experiment: set to 0 and watch turnover/cost rise.
  # 小于 NAV 1% 的调仓不做（压住等权再平衡的漂移噪声）。
  # L1 实验：改成 0 看换手与成本怎么涨。
  rebalance_band: 0.01
  quality_sell_pct: 0.25      # quality in the bottom 25% … 质量落到底部 25% …
  quality_sell_decline: 0.30  # … and down another 30% vs last period 且较上期再跌 30% 才强制卖出

costs:
  commission_bps: 0.0         # moomoo SG US commission is $0 moomoo SG 美股佣金 $0
  slippage_bps: 8.0           # one-way slippage 8bp (conservative for large caps at close) 单边滑点 8bp
  fx_one_way_bps: 0.0         # one-off SGD→USD cost; set 30–100 for your broker SGD→USD 一次性成本，按券商填 30–100
  dividend_tax_drag_annual: 0.0  # 30% US dividend withholding; turn on only when quoting net-of-tax 美股股息 30% 预扣，只在汇报到手收益时打开
