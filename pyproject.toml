[project]
name = "quant-starter"
version = "0.1.0"
description = "A small, honest, reproducible personal quant system — built for learning, safe to start with."
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qs = "qs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
